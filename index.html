<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #0a0e14; color: #e6e9ef; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: #11161f; border: 1px solid #1e2632; border-radius: 20px;
    padding: 48px 40px; max-width: 520px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px;
    background: linear-gradient(135deg, #2F80FF, #22C55E);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: #fff;
  }
  h1 { font-size: 28px; letter-spacing: -0.5px; margin-bottom: 8px; }
  p { color: #8b94a3; font-size: 15px; line-height: 1.6; }
  .status {
    margin-top: 24px; display: inline-block; font-size: 13px; font-weight: 600;
    color: #22C55E; background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.3);
    padding: 8px 18px; border-radius: 30px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">FX</div>
    <h1>Forex Calculator</h1>
    <p>Shell is live. Tell me what to build — lot-size calculator, pip-value, margin, risk/reward — and it goes here.</p>
    <span class="status">● Live</span>
  </div>
</body>
</html>
